<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#37D8E8"/>
      <stop offset="100%" stop-color="#C58BFF"/>
    </linearGradient>
    <style>
      .logo { fill:url(#grad); font-family: 'Segoe UI', Arial, sans-serif; }
      .mark { font-size:220px; font-weight:500; }
      .tag { font-size:34px; letter-spacing:8px; font-weight:300; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#000"/>

  <text x="400" y="360" class="logo mark" text-anchor="middle">{.M}</text>
  <text x="400" y="560" class="logo tag" text-anchor="middle">CODE. BUILD. SOLVE.</text>
</svg>